name: Feature request / 要望 / 功能建议
description: An idea for a new feature or an improvement / 機能の追加や改善の提案 / 新功能或改进的建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        You may write in English, Japanese or Chinese. / 日本語で書いてかまいません。 / 可以用中文填写。

        Please search the existing issues first. / 同じ要望がないか、先に Issue を検索してください。 / 请先搜索是否已有相同的建议。
  - type: textarea
    id: goal
    attributes:
      label: What you want to do / やりたいこと / 想做什么
      description: >-
        What you are trying to make or do, and what gets in the way today. /
        何を作ろうとしていて、今は何に困っているか。 /
        想做出什么，目前遇到了什么困难。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work / どうなるとよいか / 希望怎样实现
  - type: textarea
    id: examples
    attributes:
      label: Examples / 参考 / 参考
      description: >-
        Pictures or other apps that show the idea. Hide any API key first. /
        考えを示す画像や、ほかのアプリ。API キーが写っていたら隠してください。 /
        能说明想法的图片或其他应用。如果截到了 API Key，请先遮住。
