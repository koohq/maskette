name: Feature request / 機能の要望 / 功能建议
description: An idea for a new feature or an improvement / 機能の追加や改善の提案 / 新功能或改进的建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        You may write in English, Japanese or Chinese. / 日本語でも投稿できます。 / 可以用中文填写。

        Please search the existing issues first. / 投稿する前に同じ要望がないか Issue を検索してください。 / 请先搜索是否已有相同的建议。
  - type: textarea
    id: goal
    attributes:
      label: What you want to do / 実現したいこと / 想做什么
      description: >-
        What you are trying to make or do, and what gets in the way today. /
        作りたいもの・したいことと、今困っている点を記載してください。 /
        想做出什么，目前遇到了什么困难。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work / 希望する動作 / 希望怎样实现
  - type: textarea
    id: examples
    attributes:
      label: Examples / 参考 / 参考
      description: >-
        Pictures or other apps that show the idea. Hide any API key first. /
        イメージに近い画像や、同じような機能があるほかのアプリ。API キーが写っている場合は、添付する前に隠してください。 /
        能说明想法的图片或其他应用。如果截到了 API Key，请先遮住。
