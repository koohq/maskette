[package]
name = "maskette"
version = "0.1.0"
description = "Maskette: a design tool for kigurumi head shells"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "maskette_lib"
# Desktop only needs the rlib. The Tauri template's "staticlib" (iOS) and
# "cdylib" (Android) cost ~0.9 GB per debug build; add them back before
# running `tauri ios init` or `tauri android init`.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "process", "sync", "time", "rt"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "native-tls"] }
getrandom = "0.4.3"
futures-util = "0.3.34"
keyring = "4.2.0"
which = "8.0.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1.13.1"
# 9.4.x was days old; stay on a release that has been out a while.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.23.1"
ab_glyph = "0.2.32"
dejavu = "2.37.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

# Keep debug builds small: dependencies carry no debug info, and our own
# crate keeps line tables so backtraces still show file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Image coding is painfully slow unoptimised; the fixture backend writes
# full-size images even in debug builds and tests.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.zlib-rs]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.image-webp]
opt-level = 2
